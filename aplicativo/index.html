<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06070c" />
    <title>Vida em Semanas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" />
  </head>
  <body data-tela="carregando">
    <div class="ambiente" aria-hidden="true"></div>

    <header class="cabecalho" id="cabecalho">
      <div class="cabecalho-dentro">
        <div class="barra">
          <div class="marca"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="nome">Vida em <em>Semanas</em></span></div>
          <div class="granularidade" role="group" aria-label="Nível de detalhe">
            <button type="button" data-granularidade="ano" aria-pressed="true">Ano</button>
            <button type="button" data-granularidade="mes" aria-pressed="false">Mês</button>
            <button type="button" data-granularidade="semana" aria-pressed="false">Semana</button>
          </div>
          <button type="button" class="botao" id="botao-hoje">Hoje</button>
          <div class="criar">
            <button type="button" class="botao principal redondo" id="botao-criar" aria-label="Registrar" aria-haspopup="menu" aria-expanded="false">+</button>
            <div class="menu-criar" id="menu-criar" role="menu" hidden>
              <button type="button" role="menuitem" data-criar="memoria">Memória <small>algo que aconteceu</small></button>
              <button type="button" role="menuitem" data-criar="capitulo">Capítulo <small>uma fase da vida</small></button>
              <button type="button" role="menuitem" data-criar="intencao">Intenção <small>algo que você quer viver</small></button>
            </div>
          </div>
          <button type="button" class="botao redondo conta-botao" id="botao-conta" aria-label="Conta">·</button>
        </div>
        <div class="contexto" id="contexto"></div>
      </div>
    </header>

    <p class="aviso" id="aviso" role="alert" hidden></p>
    <section id="acesso" hidden></section>
    <section id="boas-vindas" hidden></section>

    <div class="rolagem"><main class="linha-do-tempo" id="linha"></main></div>

    <aside class="minimapa" id="minimapa" aria-label="A vida inteira em semanas. Toque para ir a um período.">
      <canvas></canvas>
      <div class="visor"></div>
    </aside>

    <dialog id="detalhe" aria-label="Memória"><div class="conteudo"></div></dialog>
    <dialog id="formulario" aria-label="Registrar"></dialog>
    <dialog id="conta" aria-label="Conta"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
