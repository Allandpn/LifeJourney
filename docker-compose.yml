# Vida em Semanas no Raspberry Pi. Passo a passo em docs/09-publicacao.md.
#
#   docker compose up -d --build      liga (ou atualiza depois de um git pull)
#   docker compose logs -f app        mostra o que o servidor está fazendo
#
# Nenhuma porta é aberta no Pi. O acesso de fora é escolhido no .env (COMPOSE_PROFILES):
# - tailscale: um nó Tailscale só do projeto (https://vida-em-semanas.<tailnet>.ts.net);
# - cloudflare: o túnel da Cloudflare, para quem tem domínio.

services:
  app:
    build: .
    image: vida-em-semanas:local
    restart: unless-stopped
    env_file: .env
    environment:
      # fixos aqui para o .env não conseguir mudar: modo produção e os caminhos dentro do contêiner
      LJ_MODO: producao
      LJ_BANCO: /dados/lifejourney.db
      LJ_FOTOS: /dados/fotos
      LJ_COPIAS: /copias
      LJ_APLICATIVO: /servico/aplicativo
      # o túnel informa o endereço real de quem acessa neste cabeçalho
      LJ_CABECALHO_DO_IP: CF-Connecting-IP
    # create_host_path: false faz o serviço NÃO ligar se a pasta não existir. Assim, se o
    # SSD cifrado ainda não foi aberto depois de um reinício, o servidor não cria um banco
    # novo e vazio no cartão SD: ele espera até o disco estar montado.
    volumes:
      - type: bind
        source: ${LJ_PASTA_DADOS:-./dados-pessoais/producao}
        target: /dados
        bind: { create_host_path: false }
      - type: bind
        source: ${LJ_PASTA_COPIAS:-./dados-pessoais/copias}
        target: /copias
        bind: { create_host_path: false }
    networks: [interna]

  # Nó Tailscale próprio, no modo sem privilégios (userspace), como o do Guardian.
  # Encaminha https://<TS_HOSTNAME>.<tailnet>.ts.net para o servidor pela rede interna.
  tailscale:
    profiles: [tailscale]  # só sobe com COMPOSE_PROFILES=tailscale
    image: tailscale/tailscale:v1.84.3
    hostname: ${TS_HOSTNAME:-vida-em-semanas}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}  # só na primeira vez; depois o nó fica no volume ts-state
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_USERSPACE: "true"  # sem /dev/net/tun e sem NET_ADMIN
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro
    depends_on: [app]
    networks: [interna]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 128m
    pids_limit: 128
    logging: { driver: json-file, options: { max-size: "5m", max-file: "3" } }

  tunel:
    profiles: [cloudflare]  # só sobe com COMPOSE_PROFILES=cloudflare
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]
    networks: [interna]

networks:
  interna:

volumes:
  ts-state:
