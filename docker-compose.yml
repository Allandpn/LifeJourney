# Vida em Semanas no Raspberry Pi. Passo a passo em docs/09-publicacao.md.
#
#   docker compose up -d --build      liga (ou atualiza depois de um git pull)
#   docker compose logs -f app        mostra o que o servidor está fazendo
#
# Dois jeitos de acesso de fora, escolhidos no .env (COMPOSE_FILE e COMPOSE_PROFILES):
# - Tailscale: soma docker-compose.tailscale.yml, que abre uma porta só para o próprio Pi;
# - Cloudflare: liga o perfil "cloudflare", que sobe o túnel. Nenhuma porta é aberta.

services:
  app:
    build: .
    image: vida-em-semanas:local
    restart: unless-stopped
    env_file: .env
    environment:
      # fixos aqui para o .env não conseguir mudar: modo produção e os caminhos dentro do contêiner
      LJ_MODO: producao
      LJ_BANCO: /dados/lifejourney.db
      LJ_FOTOS: /dados/fotos
      LJ_COPIAS: /copias
      LJ_APLICATIVO: /servico/aplicativo
      # o túnel informa o endereço real de quem acessa neste cabeçalho
      LJ_CABECALHO_DO_IP: CF-Connecting-IP
    # create_host_path: false faz o serviço NÃO ligar se a pasta não existir. Assim, se o
    # SSD cifrado ainda não foi aberto depois de um reinício, o servidor não cria um banco
    # novo e vazio no cartão SD: ele espera até o disco estar montado.
    volumes:
      - type: bind
        source: ${LJ_PASTA_DADOS:-./dados-pessoais/producao}
        target: /dados
        bind: { create_host_path: false }
      - type: bind
        source: ${LJ_PASTA_COPIAS:-./dados-pessoais/copias}
        target: /copias
        bind: { create_host_path: false }
    networks: [interna]

  tunel:
    profiles: [cloudflare]  # só sobe com COMPOSE_PROFILES=cloudflare
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]
    networks: [interna]

networks:
  interna:
