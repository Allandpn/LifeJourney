[project]
name = "lifejourney-servidor"
version = "0.1.0"
description = "Servidor e núcleo de cálculo do Vida em Semanas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlmodel>=0.0.22,<0.1",
    "python-dotenv>=1.0,<2",
    "pillow>=11,<13",
    "python-multipart>=0.0.18,<0.1",
    "argon2-cffi>=23.1,<26",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",  # só para converter a planilha anual do IBGE em CSV
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
pythonpath = ["testes"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient"]
